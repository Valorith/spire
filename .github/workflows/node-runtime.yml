name: Container runtime validation

on:
  pull_request:
    paths:
      - '.node-version'
      - 'Dockerfile.railway'
      - '.dockerignore'
      - 'entrypoint.railway.sh'
      - 'go.mod'
      - 'go.sum'
      - 'main.go'
      - 'boot/**'
      - 'cmd/**'
      - 'internal/**'
      - 'containers/workspace/Dockerfile'
      - 'frontend/package*.json'
      - 'frontend/eqsage-embed/package*.json'
      - '.github/workflows/node-runtime.yml'

permissions:
  contents: read

jobs:
  linux-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify workspace Node toolchain
        run: |
          docker build --file containers/workspace/Dockerfile --target node-runtime --tag node-toolchain-qa containers/workspace
          docker run --rm --env "EXPECTED_NODE_VERSION=v$(cat .node-version)" --entrypoint sh node-toolchain-qa -c 'test "$(node --version)" = "$EXPECTED_NODE_VERSION" && npm --version && npx --version && corepack --version && test ! -L /usr/local/bin/yarn'
      - name: Build optional Railway frontend stage
        run: docker build --file Dockerfile.railway --target frontend --tag node-frontend-qa .
      - run: docker run --rm --entrypoint node node-frontend-qa --version | grep -Fx "v$(cat .node-version)"
      - name: Build optional Railway backend stage
        run: docker build --file Dockerfile.railway --target backend --tag railway-backend-qa .
      - name: Verify Railway Go toolchain and backend regressions
        run: |
          expected_go_version="$(sed -n 's/^FROM golang:\([0-9.]*\)-bookworm AS backend$/go\1/p' Dockerfile.railway)"
          test -n "$expected_go_version"
          docker run --rm --env "EXPECTED_GO_VERSION=$expected_go_version" --env CGO_ENABLED=0 --env GOTOOLCHAIN=local --entrypoint sh railway-backend-qa -ec '
            test "$(go env GOVERSION)" = "$EXPECTED_GO_VERSION"
            go version -m /out/spire | head -n 1 | grep -Fw "$EXPECTED_GO_VERSION"
            go test -count=1 -timeout=10m ./boot ./internal/http/... ./internal/database ./internal/permissions ./internal/websocket ./internal/updater ./internal/atomicfile ./internal/filepathcheck
            GOOS=linux GOARCH=arm64 go build -o /tmp/spire-linux-arm64 ./main.go
          '
      - name: Build and verify optional Railway runtime image
        run: |
          docker build --file Dockerfile.railway --tag railway-runtime-qa .
          docker run --rm --entrypoint sh railway-runtime-qa -ec '
            test "$(id -u)" = 10001
            test -x /app/spire
            test -x /entrypoint.sh
            test -s /app/frontend/dist/index.html
            test -s /frontend/dist/index.html
          '
