name: Background development processes

on:
  pull_request:
    paths:
      - '.node-version'
      - 'tools/dev-process/**'
      - '.github/workflows/dev-process.yml'
      - 'package.json'
      - 'go.mod'
  push:
    branches: [master]
    paths:
      - '.node-version'
      - 'tools/dev-process/**'
      - '.github/workflows/dev-process.yml'
      - 'package.json'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  background-process:
    # ARM64 runner allocation failed twice; keep the same macOS check on Intel.
    # This standard image uses the same current macOS 26 release.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26-intel' || matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: go.mod
      - run: npm run test:dev-process
